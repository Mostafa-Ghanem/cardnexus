name: Cloudflare Workers D1 compatibility

on:
  push:
    branches: ["feature/cloudflare-workers-d1"]
  workflow_dispatch:

concurrency:
  group: cloudflare-d1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./dev.db
      BETTER_AUTH_SECRET: ci-secret-not-for-production-1234567890
      BETTER_AUTH_URL: http://localhost:8787
      APP_URL: http://localhost:8787
      NEXT_PUBLIC_APP_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and resolve Cloudflare toolchain
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client and validate schema
        run: |
          npx prisma validate
          npx prisma generate
      - name: Generate D1 initial migration
        run: npm run db:migration:generate
      - name: Apply migration on isolated local D1
        run: npx wrangler d1 migrations apply cardnexus-d1 --local
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Build Cloudflare Worker using vinext
        run: npm run build
      - name: HTTP smoke test using local Workerd preview
        shell: bash
        run: |
          cat > .dev.vars <<EOF
          APP_URL=http://localhost:8787
          BETTER_AUTH_URL=http://localhost:8787
          BETTER_AUTH_SECRET=ci-only-32-byte-very-long-secret-for-workerd
          EMAIL_FROM=ci@example.invalid
          EOF
          npm run preview -- --host 127.0.0.1 --port 8787 > /tmp/cardnexus-cloudflare-preview.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            tail -n 100 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8787/login -o /dev/null
          curl --fail --silent http://127.0.0.1:8787/register -o /dev/null
          echo "Worker preview responded on /, /login, and /register."
          # Exercise real D1-backed Better Auth and card routes in local workerd.
          signup_status="$(curl -sS -o /tmp/nfc-signup.json -w '%{http_code}' \
            -c /tmp/nfc-cookies.txt -X POST http://127.0.0.1:8787/api/auth/sign-up/email \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8787' \
            -d '{"name":"Cloudflare CI","email":"cloudflare-ci@example.invalid","password":"CI-Cloudflare-LongPassword123!"}')"
          if [ "$signup_status" != "200" ]; then
            echo "signup HTTP $signup_status"
            cat /tmp/nfc-signup.json
            tail -n 80 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          cards_status="$(curl -sS -o /tmp/nfc-cards.json -w '%{http_code}' \
            -b /tmp/nfc-cookies.txt -X POST http://127.0.0.1:8787/api/cards \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8787' \
            -d '{"name":"Cloudflare CI NFC","firstName":"CI","lastName":"Visitor"}')"
          if [ "$cards_status" != "201" ]; then
            echo "card creation HTTP $cards_status"
            cat /tmp/nfc-cards.json
            tail -n 80 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          card_slug="$(node -e 'const j=require("/tmp/nfc-cards.json"); process.stdout.write(j.slug || "")')"
          test -n "$card_slug"
          curl --fail --silent "http://127.0.0.1:8787/api/cards/$card_slug" -o /tmp/nfc-public-card.json
          echo "Workerd auth -> D1 user -> card -> public card API roundtrip passed."
          # Lead capture is available to Pro. Upgrade only the disposable CI
          # user inside the local D1 binding before testing lead insertion.
          npx wrangler d1 execute cardnexus-d1 --local --command "UPDATE user SET plan='pro' WHERE email='cloudflare-ci@example.invalid';"
          card_id="$(node -e 'const j=require("/tmp/nfc-cards.json"); process.stdout.write(j.id || "")')"
          lead_status="$(curl -sS -o /tmp/nfc-lead.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8787/api/leads \
            -H 'Content-Type: application/json' \
            -d "{\"cardId\":\"$card_id\",\"name\":\"Workerd Lead\",\"phone\":\"+201111111111\",\"email\":\"test@example.invalid\"}")"
          if [ "$lead_status" != "200" ]; then
            echo "lead capture HTTP $lead_status"
            cat /tmp/nfc-lead.json
            tail -n 100 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          grep -q '"success":true' /tmp/nfc-lead.json
          # One-pixel PNG: exercises actual R2 put/get from an authenticated session.
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/bdoAAAAASUVORK5CYII=' | base64 -d > /tmp/nfc-test.png
          upload_status="$(curl -sS -o /tmp/nfc-upload.json -w '%{http_code}' \
            -b /tmp/nfc-cookies.txt -X POST http://127.0.0.1:8787/api/upload \
            -F 'file=@/tmp/nfc-test.png;type=image/png')"
          if [ "$upload_status" != "200" ]; then
            echo "R2 upload HTTP $upload_status"
            cat /tmp/nfc-upload.json
            tail -n 100 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          upload_url="$(node -e 'const j=require("/tmp/nfc-upload.json"); process.stdout.write(j.url || "")')"
          test -n "$upload_url"
          curl --fail --silent "http://127.0.0.1:8787$upload_url" -o /tmp/nfc-stored.png
          cmp /tmp/nfc-stored.png /tmp/nfc-test.png
          echo "Workerd lead capture and Cloudflare R2 image upload/download passed."
      - name: Commit lockfile and generated migration to feature branch
        if: success() && github.event_name == 'push' && github.ref_name == 'feature/cloudflare-workers-d1'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json migrations/0001_init.sql
          if ! git diff --staged --quiet; then
            git commit -m "build(cloudflare): lock dependencies and add verified D1 schema [skip ci]"
            git push origin HEAD:feature/cloudflare-workers-d1
          fi
