name: Hostinger V4 CRM integration - D1 migration and authorization

on:
  push:
    branches: ["feature/merge-hostinger-v4-phase2-crm"]
  workflow_dispatch:

concurrency:
  group: cloudflare-d1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./dev.db
      BETTER_AUTH_SECRET: ci-secret-not-for-production-1234567890
      BETTER_AUTH_URL: http://localhost:8787
      APP_URL: http://localhost:8787
      NEXT_PUBLIC_APP_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and resolve Cloudflare toolchain
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client and validate schema
        run: |
          npx prisma validate
          npx prisma generate
      - name: Apply migration on isolated local D1
        run: npx wrangler d1 migrations apply cardnexus-visual-preview-20261103-db --local
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Build Cloudflare Worker using vinext
        run: npm run build
      - name: Verify Wrangler deployment artifact without publishing
        run: npx wrangler deploy --dry-run
      - name: HTTP smoke test using local Workerd preview
        shell: bash
        run: |
          cat > .dev.vars <<EOF
          APP_URL=http://localhost:8787
          BETTER_AUTH_URL=http://localhost:8787
          BETTER_AUTH_SECRET=ci-only-32-byte-very-long-secret-for-workerd
          EMAIL_FROM=ci@example.invalid
          EOF
          npm run preview -- --host 127.0.0.1 --port 8787 > /tmp/cardnexus-cloudflare-preview.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            tail -n 100 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8787/login -o /dev/null
          curl --fail --silent http://127.0.0.1:8787/register -o /dev/null
          echo "Worker preview responded on /, /login, and /register."
          # Exercise real D1-backed Better Auth and card routes in local workerd.
          signup_status="$(curl -sS -o /tmp/nfc-signup.json -w '%{http_code}' \
            -c /tmp/nfc-cookies.txt -X POST http://127.0.0.1:8787/api/auth/sign-up/email \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8787' \
            -d '{"name":"Cloudflare CI","email":"cloudflare-ci@example.invalid","password":"CI-Cloudflare-LongPassword123!"}')"
          if [ "$signup_status" != "200" ]; then
            echo "signup HTTP $signup_status"
            cat /tmp/nfc-signup.json
            tail -n 80 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          # Sensitive user listing must be forbidden for ordinary members.
          unauth_users="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/users)"
          test "$unauth_users" = "401"
          member_users="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/nfc-cookies.txt http://127.0.0.1:8787/api/users)"
          test "$member_users" = "403"
          cards_status="$(curl -sS -o /tmp/nfc-cards.json -w '%{http_code}' \
            -b /tmp/nfc-cookies.txt -X POST http://127.0.0.1:8787/api/cards \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8787' \
            -d '{"name":"Cloudflare CI NFC","firstName":"CI","lastName":"Visitor","title":"Marketing","company":"Demo","mobile":"+966500000001","email":"contact@example.invalid"}')"
          if [ "$cards_status" != "201" ]; then
            echo "card creation HTTP $cards_status"
            cat /tmp/nfc-cards.json
            tail -n 80 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          node -e 'const j=require("/tmp/nfc-cards.json"); if(j.title!=="Marketing"||j.company!=="Demo"||j.mobile!=="+966500000001"){process.exit(1)}'
          card_slug="$(node -e 'const j=require("/tmp/nfc-cards.json"); process.stdout.write(j.slug || "")')"
          test -n "$card_slug"
          curl --fail --silent "http://127.0.0.1:8787/api/cards/$card_slug" -o /tmp/nfc-public-card.json
          wizard_status="$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/nfc-cookies.txt http://127.0.0.1:8787/card)"
          test "$wizard_status" = "200"
          echo "Workerd auth, scoped users API, card creation, and onboarding route passed."
          # Lead capture is available to Pro. Upgrade only the disposable CI
          # user inside the local D1 binding before testing lead insertion.
          npx wrangler d1 execute cardnexus-visual-preview-20261103-db --local --command "UPDATE user SET plan='pro' WHERE email='cloudflare-ci@example.invalid';"
          card_id="$(node -e 'const j=require("/tmp/nfc-cards.json"); process.stdout.write(j.id || "")')"
          # A public lead without phone/email must fail validation.
          missing_contact="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/api/leads -H 'Content-Type: application/json' -d "{\"cardId\":\"$card_id\",\"name\":\"No contact\"}")"
          test "$missing_contact" = "400"
          lead_status="$(curl -sS -o /tmp/nfc-lead.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8787/api/leads \
            -H 'Content-Type: application/json' \
            -d "{\"cardId\":\"$card_id\",\"name\":\"Workerd Lead\",\"phone\":\"+201111111111\",\"email\":\"test@example.invalid\"}")"
          if [ "$lead_status" != "200" ]; then
            echo "lead capture HTTP $lead_status"
            cat /tmp/nfc-lead.json
            tail -n 100 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          grep -q '"success":true' /tmp/nfc-lead.json
          lead_id="$(node -e 'const j=require("/tmp/nfc-lead.json"); process.stdout.write(j.id || "")')"
          test -n "$lead_id"
          # A lead's owner can update its pipeline and private notes.
          update_code="$(curl -sS -o /tmp/nfc-updated-lead.json -w '%{http_code}' \
            -b /tmp/nfc-cookies.txt -X PATCH http://127.0.0.1:8787/api/leads/my \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$lead_id\",\"status\":\"interested\",\"note\":\"Follow up via WhatsApp\"}")"
          test "$update_code" = "200"
          grep -q '"status":"interested"' /tmp/nfc-updated-lead.json
          owner_leads="$(curl -sS -b /tmp/nfc-cookies.txt http://127.0.0.1:8787/api/leads/my)"
          echo "$owner_leads" | grep -q '"interested"'
          # Another signed-in user must not access or modify the lead.
          outsider="$(curl -sS -o /dev/null -w '%{http_code}' \
            -c /tmp/nfc-outsider.txt -X POST http://127.0.0.1:8787/api/auth/sign-up/email \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8787' \
            -d '{"name":"Second User","email":"outsider@example.invalid","password":"CI-Secure-Second-Password123!"}')"
          test "$outsider" = "200"
          outsider_update="$(curl -sS -o /dev/null -w '%{http_code}' \
            -b /tmp/nfc-outsider.txt -X PATCH http://127.0.0.1:8787/api/leads/my \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$lead_id\",\"status\":\"won\"}")"
          test "$outsider_update" = "404"
          echo "D1 pipeline migration, card ownership, CRM PATCH and lead listing passed."
          # One-pixel PNG: exercises actual R2 put/get from an authenticated session.
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/bdoAAAAASUVORK5CYII=' | base64 -d > /tmp/nfc-test.png
          upload_status="$(curl -sS -o /tmp/nfc-upload.json -w '%{http_code}' \
            -b /tmp/nfc-cookies.txt -X POST http://127.0.0.1:8787/api/upload \
            -F 'file=@/tmp/nfc-test.png;type=image/png')"
          if [ "$upload_status" != "200" ]; then
            echo "R2 upload HTTP $upload_status"
            cat /tmp/nfc-upload.json
            tail -n 100 /tmp/cardnexus-cloudflare-preview.log
            exit 1
          fi
          upload_url="$(node -e 'const j=require("/tmp/nfc-upload.json"); process.stdout.write(j.url || "")')"
          test -n "$upload_url"
          curl --fail --silent "http://127.0.0.1:8787$upload_url" -o /tmp/nfc-stored.png
          cmp /tmp/nfc-stored.png /tmp/nfc-test.png
          echo "Workerd lead capture and Cloudflare R2 image upload/download passed."
